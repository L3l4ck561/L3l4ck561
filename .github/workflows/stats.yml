name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats
        run: |
          curl --fail -L \
          -o assets/github-stats.svg \
          "https://github-readme-stats-2f38y9d45-l3l4ck561s-projects.vercel.app/api?username=L3l4ck561&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&cache_seconds=86400"

          curl --fail -L \
          -o assets/top-langs.svg \
          "https://github-readme-stats-2f38y9d45-l3l4ck561s-projects.vercel.app/api/top-langs/?username=L3l4ck561&layout=compact&theme=tokyonight&hide_border=true&cache_seconds=86400"

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add assets/*.svg
          git commit -m "update stats" || echo "no changes"
          git push
